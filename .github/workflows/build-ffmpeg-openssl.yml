name: Build FFmpeg HTTPS (OpenSSL) and M3-Play APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ffmpeg:
    name: FFmpeg TLS - ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git make pkg-config nasm yasm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch FFmpeg 7.1 source
        run: |
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg

      - name: Build FFmpeg with supplied OpenSSL archives
        run: |
          mkdir -p "artifacts/${{ matrix.abi }}"
          ./scripts/build-ffmpeg-openssl-android.sh \
            "${{ matrix.abi }}" \
            "$GITHUB_WORKSPACE/ffmpeg" \
            "$GITHUB_WORKSPACE/artifacts/${{ matrix.abi }}"

      - name: Upload FFmpeg native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  build-apk:
    name: Build M3-Play APKs with TLS FFmpeg
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all ABI FFmpeg libraries
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: app/src/main/jniLibs
          merge-multiple: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build ARM64 and universal debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleArm64Debug assembleUniversalDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: m3play-openssl-debug-apks
          path: |
            app/build/outputs/apk/arm64/debug/*.apk
            app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload rebuilt FFmpeg libraries for future builds
        uses: actions/upload-artifact@v4
        with:
          name: m3play-openssl-ffmpeg-jniLibs
          path: app/src/main/jniLibs/*/lib*.so
          if-no-files-found: error
          retention-days: 14
